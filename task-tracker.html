<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Workflow — Longevity by Izabela</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FAF8F5; --cream-mid: #F0EBE3; --gold: #C9A96E;
      --gold-dark: #B8956A; --brown: #2C2420; --sage: #8B9E7A; --taupe: #E8E0D5;
    }
    body { background: var(--cream); color: var(--brown); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }

    /* HEADER */
    header { background: var(--brown); padding: 32px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
    .header-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--cream); letter-spacing: 0.04em; }
    .header-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; color: var(--cream); }

    /* PROGRESS */
    .progress-wrap { padding: 40px 40px 0; max-width: 900px; margin: 0 auto; }
    .progress-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
    .progress-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--sage); }
    .progress-count { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--gold); }
    .progress-count span { font-size: 1rem; color: rgba(44,36,32,0.35); font-family: 'Inter', sans-serif; font-size: 11px; }
    .progress-bar-bg { height: 2px; background: var(--taupe); border-radius: 2px; }
    .progress-bar-fill { height: 2px; background: var(--gold); border-radius: 2px; transition: width 0.5s ease; }
    .progress-done-msg { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem; color: var(--sage); margin-top: 10px; min-height: 24px; }

    /* CLIENT NAME */
    .client-wrap { padding: 24px 40px 0; max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .client-wrap label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(44,36,32,0.4); white-space: nowrap; }
    .client-wrap input {
      background: transparent; border: none; border-bottom: 1px solid var(--taupe);
      font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--brown);
      padding: 4px 8px; outline: none; width: 220px; transition: border-color 0.2s;
    }
    .client-wrap input:focus { border-color: var(--gold); }
    .client-wrap input::placeholder { color: rgba(44,36,32,0.28); }

    /* SECTIONS */
    .sections { max-width: 900px; margin: 0 auto; padding: 32px 40px 80px; display: flex; flex-direction: column; gap: 32px; }
    .section-block { background: #fff; border: 1px solid var(--taupe); }
    .section-head {
      padding: 20px 28px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--taupe); cursor: pointer; user-select: none;
    }
    .section-head:hover { background: var(--cream); }
    .section-head-left { display: flex; align-items: center; gap: 14px; }
    .section-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--taupe); flex-shrink: 0; transition: background 0.3s; }
    .section-dot.complete { background: var(--sage); }
    .section-name { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--brown); }
    .section-meta { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(44,36,32,0.35); }
    .section-chevron { font-size: 11px; color: var(--gold); transition: transform 0.3s; }
    .section-chevron.open { transform: rotate(180deg); }
    .task-list { display: none; }
    .task-list.open { display: block; }

    /* TASKS */
    .task-item {
      padding: 16px 28px; display: flex; align-items: flex-start; gap: 14px;
      border-bottom: 1px solid rgba(232,224,213,0.5); transition: background 0.2s;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: var(--cream); }
    .task-cb { position: relative; flex-shrink: 0; margin-top: 2px; }
    .task-cb input { position: absolute; opacity: 0; width: 18px; height: 18px; cursor: pointer; margin: 0; }
    .task-cb-box {
      width: 18px; height: 18px; border: 1px solid var(--taupe); background: #fff;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s; pointer-events: none;
    }
    .task-cb input:checked + .task-cb-box { background: var(--sage); border-color: var(--sage); }
    .task-cb-check { display: none; color: #fff; font-size: 10px; }
    .task-cb input:checked + .task-cb-box .task-cb-check { display: block; }
    .task-text-wrap { flex: 1; }
    .task-label { font-size: 13px; color: var(--brown); line-height: 1.5; transition: color 0.2s; cursor: pointer; }
    .task-label.done { color: rgba(44,36,32,0.3); text-decoration: line-through; }
    .task-sub { font-size: 11px; color: rgba(44,36,32,0.4); margin-top: 3px; }
    .task-actions { display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity 0.2s; }
    .task-item:hover .task-actions { opacity: 1; }
    .task-del { background: none; border: none; cursor: pointer; font-size: 14px; color: rgba(44,36,32,0.25); transition: color 0.2s; padding: 2px; }
    .task-del:hover { color: #c0392b; }

    /* ADD TASK */
    .add-task-row { padding: 12px 28px; display: flex; gap: 10px; border-top: 1px solid var(--taupe); background: var(--cream-mid); }
    .add-task-input {
      flex: 1; background: #fff; border: 1px solid var(--taupe); padding: 10px 14px;
      font-family: 'Inter', sans-serif; font-size: 13px; color: var(--brown); outline: none; transition: border-color 0.2s;
    }
    .add-task-input:focus { border-color: var(--gold); }
    .add-task-input::placeholder { color: rgba(44,36,32,0.3); }
    .add-task-btn {
      background: var(--gold); color: #fff; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 10px 18px; transition: background 0.2s;
    }
    .add-task-btn:hover { background: var(--gold-dark); }

    /* ADD CLIENT SECTION */
    .add-client-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: transparent; border: 1px dashed var(--taupe); padding: 18px;
      font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(44,36,32,0.35); cursor: pointer; transition: all 0.2s; width: 100%;
    }
    .add-client-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* RESET */
    .reset-wrap { max-width: 900px; margin: 0 auto; padding: 0 40px 40px; text-align: right; }
    .reset-btn {
      background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif;
      font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(44,36,32,0.25); transition: color 0.2s;
    }
    .reset-btn:hover { color: #c0392b; }

    @media (max-width: 600px) {
      header { padding: 24px 20px; }
      .progress-wrap, .sections, .client-wrap, .reset-wrap { padding-left: 20px; padding-right: 20px; }
      .task-item { padding: 14px 16px; }
      .add-task-row { padding: 10px 16px; }
      .section-head { padding: 16px 16px; }
    }
  </style>
</head>
<body>

<header>
  <span class="header-logo">Longevity by Izabela</span>
  <span class="header-title">Client Workflow Tracker</span>
</header>

<div class="progress-wrap">
  <div class="progress-top">
    <span class="progress-label">Overall progress</span>
    <span class="progress-count" id="progressCount">0 <span>tasks completed</span></span>
  </div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
  <p class="progress-done-msg" id="progressMsg"></p>
</div>

<div class="client-wrap">
  <label>Client</label>
  <input type="text" id="clientName" placeholder="Enter client name…" oninput="saveAll()" />
</div>

<div class="sections" id="sections"></div>

<div class="reset-wrap">
  <button class="reset-btn" onclick="confirmReset()">↺ Reset all tasks</button>
</div>

<script>
const CALENDLY = 'https://calendly.com/izabela-ostatek/15min'

const defaultSections = [
  {
    id: 'pre-booking',
    name: 'Before Booking',
    tasks: [
      { id: 'pb1', text: 'Send discovery call link to client', sub: 'Share your Calendly link', done: false },
      { id: 'pb2', text: 'Confirm call is scheduled', sub: 'Check Calendly for the booking', done: false },
    ]
  },
  {
    id: 'pre-call',
    name: 'Before the Call',
    tasks: [
      { id: 'pc1', text: 'Send pre-call email (24h before)', sub: 'What to expect + how to prepare', done: false },
      { id: 'pc2', text: 'Send intake questionnaire', sub: 'Gut, sleep, energy, stress history', done: false },
      { id: 'pc3', text: 'Review intake form answers', sub: 'Note key patterns and red flags', done: false },
      { id: 'pc4', text: 'Prepare personalised call notes', sub: 'Based on intake responses', done: false },
    ]
  },
  {
    id: 'during-call',
    name: 'During the Call',
    tasks: [
      { id: 'dc1', text: 'Understand their full health history', sub: 'Gut, sleep, cortisol, energy, diet', done: false },
      { id: 'dc2', text: 'Identify root cause priorities', sub: 'What to tackle first', done: false },
      { id: 'dc3', text: 'Explain your approach and method', sub: 'Set expectations on timeline', done: false },
      { id: 'dc4', text: 'Present program options', sub: '1:1, retreat, digital product', done: false },
    ]
  },
  {
    id: 'post-call',
    name: 'After the Call',
    tasks: [
      { id: 'poc1', text: 'Send post-call summary email', sub: 'Recap + next steps + CTA', done: false },
      { id: 'poc2', text: 'Send program proposal if relevant', sub: 'Customised offer based on call', done: false },
      { id: 'poc3', text: 'Follow up if no response in 48h', sub: 'One gentle message', done: false },
      { id: 'poc4', text: 'Mark client as active or archived', sub: 'Update your client list', done: false },
    ]
  },
  {
    id: 'onboarding',
    name: 'Client Onboarding',
    tasks: [
      { id: 'on1', text: 'Send welcome email + onboarding pack', sub: 'What to expect from working together', done: false },
      { id: 'on2', text: 'Create personalised protocol document', sub: 'Gut, sleep, cortisol, nutrition plan', done: false },
      { id: 'on3', text: 'Schedule first proper session', sub: 'Calendar invite + confirmation', done: false },
      { id: 'on4', text: 'Set 30-day check-in reminder', sub: 'Track early progress', done: false },
    ]
  }
]

function loadData() {
  const saved = localStorage.getItem('hwi-tracker')
  if (saved) return JSON.parse(saved)
  return { clientName: '', sections: JSON.parse(JSON.stringify(defaultSections)) }
}

function saveAll() {
  const data = {
    clientName: document.getElementById('clientName').value,
    sections: currentSections
  }
  localStorage.setItem('hwi-tracker', JSON.stringify(data))
  updateProgress()
}

let currentSections = []

function renderAll() {
  const data = loadData()
  currentSections = data.sections
  document.getElementById('clientName').value = data.clientName || ''
  renderSections()
  updateProgress()
}

function renderSections() {
  const container = document.getElementById('sections')
  container.innerHTML = ''

  currentSections.forEach((section, si) => {
    const total = section.tasks.length
    const done = section.tasks.filter(t => t.done).length
    const complete = done === total && total > 0

    const block = document.createElement('div')
    block.className = 'section-block'
    block.innerHTML = `
      <div class="section-head" onclick="toggleSection(${si})">
        <div class="section-head-left">
          <div class="section-dot ${complete ? 'complete' : ''}" id="dot-${si}"></div>
          <span class="section-name">${section.name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <span class="section-meta" id="meta-${si}">${done}/${total}</span>
          <span class="section-chevron open" id="chevron-${si}">▼</span>
        </div>
      </div>
      <div class="task-list open" id="tasklist-${si}">
        ${section.tasks.map((task, ti) => renderTask(task, si, ti)).join('')}
        <div class="add-task-row">
          <input class="add-task-input" placeholder="Add a task…" id="newtask-${si}" onkeydown="if(event.key==='Enter') addTask(${si})" />
          <button class="add-task-btn" onclick="addTask(${si})">Add</button>
        </div>
      </div>
    `
    container.appendChild(block)
  })

  // Add new section button
  const addBtn = document.createElement('button')
  addBtn.className = 'add-client-btn'
  addBtn.innerHTML = '+ Add new section'
  addBtn.onclick = addSection
  container.appendChild(addBtn)
}

function renderTask(task, si, ti) {
  return `
    <div class="task-item" id="task-${si}-${ti}">
      <label class="task-cb">
        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${si}, ${ti})" />
        <div class="task-cb-box"><span class="task-cb-check">✓</span></div>
      </label>
      <div class="task-text-wrap">
        <div class="task-label ${task.done ? 'done' : ''}" onclick="toggleTask(${si},${ti})">${task.text}</div>
        ${task.sub ? `<div class="task-sub">${task.sub}</div>` : ''}
      </div>
      <div class="task-actions">
        <button class="task-del" onclick="deleteTask(${si},${ti})" title="Remove">✕</button>
      </div>
    </div>
  `
}

function toggleSection(si) {
  const list = document.getElementById(`tasklist-${si}`)
  const chevron = document.getElementById(`chevron-${si}`)
  list.classList.toggle('open')
  chevron.classList.toggle('open')
}

function toggleTask(si, ti) {
  currentSections[si].tasks[ti].done = !currentSections[si].tasks[ti].done
  saveAll()
  renderSections()
}

function addTask(si) {
  const input = document.getElementById(`newtask-${si}`)
  const text = input.value.trim()
  if (!text) return
  currentSections[si].tasks.push({
    id: 'custom-' + Date.now(),
    text, sub: '', done: false
  })
  saveAll()
  renderSections()
  // Re-open and focus
  document.getElementById(`tasklist-${si}`).classList.add('open')
}

function deleteTask(si, ti) {
  currentSections[si].tasks.splice(ti, 1)
  saveAll()
  renderSections()
}

function addSection() {
  const name = prompt('Section name:')
  if (!name) return
  currentSections.push({ id: 'custom-' + Date.now(), name, tasks: [] })
  saveAll()
  renderSections()
}

function updateProgress() {
  let total = 0, done = 0
  currentSections.forEach(s => {
    total += s.tasks.length
    done += s.tasks.filter(t => t.done).length
  })
  const pct = total ? Math.round((done / total) * 100) : 0
  document.getElementById('progressBar').style.width = pct + '%'
  document.getElementById('progressCount').innerHTML = `${done} <span>of ${total} tasks completed</span>`

  const msgs = ['', 'Good start.', 'Keep going.', 'Halfway there.', 'Almost done.', 'All done. ✓']
  const idx = pct === 100 ? 5 : pct >= 75 ? 4 : pct >= 50 ? 3 : pct >= 25 ? 2 : pct > 0 ? 1 : 0
  document.getElementById('progressMsg').textContent = msgs[idx]
}

function confirmReset() {
  if (confirm('Reset all tasks to unchecked? This cannot be undone.')) {
    currentSections.forEach(s => s.tasks.forEach(t => t.done = false))
    saveAll()
    renderSections()
  }
}

renderAll()
</script>
</body>
</html>
